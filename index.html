<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04050a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Taskflow</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#04050a;--teal:#12e5c4;--blue:#2d7bff;--vio:#8b5cf6;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.15);--tx:#eef3ff;--mut:#98a2c0;--hi:#ff5d7a;--mid:#ffc24d;--lo:#12e5c4;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.4 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.5;z-index:0;pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
.b1{width:60vmax;height:60vmax;background:var(--blue);top:-25vmax;left:-20vmax}
.b2{width:50vmax;height:50vmax;background:var(--vio);bottom:-20vmax;right:-15vmax;animation-delay:-6s}
.b3{width:36vmax;height:36vmax;background:var(--teal);top:35%;left:40%;opacity:.3;animation-delay:-11s}
@keyframes drift{0%{transform:translate(0,0) scale(1) rotate(0)}50%{transform:translate(8vmax,-5vmax) scale(1.15) rotate(40deg)}100%{transform:translate(-6vmax,6vmax) scale(.9) rotate(-30deg)}}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(255,255,255,.04),0 12px 40px rgba(0,0,0,.45)}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:22px 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;margin-bottom:14px;animation:rise .8s cubic-bezier(.2,.9,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
h1{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:800}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
.ring{position:relative;width:68px;height:68px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.1)}
.ring .pg{stroke:url(#g);stroke-dasharray:163.4;stroke-dashoffset:163.4;transition:stroke-dashoffset 1s cubic-bezier(.2,.9,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.add{padding:12px;margin-bottom:14px;display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select{font:inherit;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;min-width:0;transition:border-color .25s,box-shadow .25s}
input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(18,229,196,.18)}
select option{background:#0b0d18}
#title{flex:1 1 100%}
.row input[type=date],.row select{flex:1}
.btn{border:0;cursor:pointer;color:#04050a;font-weight:700;font:inherit;font-weight:700;padding:12px 20px;border-radius:14px;background:linear-gradient(120deg,var(--teal),var(--blue) 55%,var(--vio));background-size:200% 100%;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background-position .6s,box-shadow .3s;box-shadow:0 6px 24px rgba(45,123,255,.35)}
.btn:hover{background-position:100% 0}.btn:active{transform:scale(.94)}
.tools{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.tools input{flex:1 1 140px}
.chips{display:flex;gap:4px;padding:4px;border-radius:16px;position:relative}
.chip{position:relative;z-index:1;border:0;background:none;color:var(--mut);font:inherit;font-size:14px;padding:8px 14px;border-radius:12px;cursor:pointer;transition:color .3s}
.chip.on{color:var(--tx);background:linear-gradient(120deg,rgba(18,229,196,.28),rgba(139,92,246,.35));box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.task{position:relative;display:flex;align-items:center;gap:14px;padding:14px 12px 14px 14px;animation:pop .55s cubic-bezier(.2,1.2,.3,1) both;transition:opacity .4s,transform .4s}
.task.menu-open{z-index:5}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
.task.out{opacity:0;transform:translateX(60px) scale(.9)}
.tick{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:transparent;cursor:pointer;display:grid;place-items:center;transition:all .35s cubic-bezier(.3,1.7,.5,1)}
.tick:hover{border-color:var(--teal);transform:scale(1.1)}
.tick svg{width:16px;height:16px;fill:none;stroke:#04050a;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s .12s}
.done .tick{background:linear-gradient(135deg,var(--teal),var(--blue));border-color:transparent;box-shadow:0 0 22px rgba(18,229,196,.55);animation:bump .5s}
.done .tick svg{stroke-dashoffset:0}
@keyframes bump{40%{transform:scale(1.3)}}
.body{flex:1;min-width:0}
.t{font-weight:600;overflow-wrap:anywhere;transition:color .3s,opacity .3s}
.done .t{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--vio);opacity:.8}
.meta{display:flex;gap:10px;font-size:12.5px;color:var(--mut);margin-top:4px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;box-shadow:0 0 8px currentColor}
.late{color:var(--hi)}
.more{flex:none;width:38px;height:38px;border-radius:12px;border:0;background:none;color:var(--mut);cursor:pointer;font-size:20px;letter-spacing:1px;transition:background .25s}
.more:hover{background:rgba(255,255,255,.1);color:var(--tx)}
.menu{position:absolute;right:12px;top:54px;min-width:140px;padding:6px;border-radius:16px;background:rgba(14,16,30,.82);border:1px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 18px 40px rgba(0,0,0,.6);transform-origin:top right;animation:menu .3s cubic-bezier(.2,1.4,.4,1) both}
@keyframes menu{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer}
.menu button:hover{background:rgba(255,255,255,.1)}
.menu .del{color:var(--hi)}
.empty{text-align:center;padding:48px 20px;color:var(--mut);animation:rise .6s both}
.empty .orb{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--teal),var(--blue) 50%,var(--vio));filter:blur(.5px);animation:orb 4s ease-in-out infinite;box-shadow:0 0 50px rgba(139,92,246,.5)}
@keyframes orb{0%,100%{border-radius:50% 50% 45% 55%;transform:translateY(0)}50%{border-radius:42% 58% 55% 45%;transform:translateY(-10px)}}
.foot{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-top:14px;padding:0 6px}
.link{background:none;border:0;color:var(--teal);font:inherit;font-size:13px;cursor:pointer}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:16px}
.modal.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:520px;padding:20px;display:grid;gap:12px;animation:sheet .5s cubic-bezier(.2,1.1,.3,1);background:rgba(16,18,34,.8)}
@keyframes sheet{from{transform:translateY(80px) scale(.95);opacity:0}}
.sheet h2{margin:0;font-size:19px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);z-index:30;padding:12px 16px;display:flex;gap:14px;align-items:center;transition:transform .5s cubic-bezier(.2,1.3,.4,1);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
#inst{display:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main>
<header class="glass">
  <div><h1>Taskflow</h1><div class="sub" id="sub"></div></div>
  <div class="ring"><svg width="68" height="68" viewBox="0 0 60 60"><defs><linearGradient id="g"><stop offset="0" stop-color="#12e5c4"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><circle class="tr" cx="30" cy="30" r="26"/><circle class="pg" id="pg" cx="30" cy="30" r="26"/></svg><b id="pct">0%</b></div>
</header>

<section class="glass add">
  <input id="title" placeholder="What needs doing?" maxlength="120" aria-label="Task title">
  <div class="row">
    <select id="pri" aria-label="Priority"><option value="1">Low</option><option value="2" selected>Medium</option><option value="3">High</option></select>
    <input id="due" type="date" aria-label="Due date">
    <button class="btn" id="addb">Add task</button>
  </div>
</section>

<div class="tools">
  <input id="q" type="search" placeholder="Search tasks" aria-label="Search">
  <div class="chips glass" id="chips">
    <button class="chip on" data-f="all">All</button><button class="chip" data-f="active">Active</button><button class="chip" data-f="done">Done</button>
  </div>
</div>

<ul id="list"></ul>
<div class="foot"><span id="left"></span><span><button class="link" id="inst">Install app</button> <button class="link" id="clr">Clear completed</button></span></div>
</main>

<div class="modal" id="modal"><div class="sheet glass">
  <h2>Edit task</h2>
  <input id="et" maxlength="120" aria-label="Title">
  <div class="row"><select id="ep"><option value="1">Low</option><option value="2">Medium</option><option value="3">High</option></select><input id="ed" type="date"></div>
  <div class="row"><button class="btn" id="save" style="flex:1">Save changes</button><button class="btn" id="cancel" style="flex:1;background:rgba(255,255,255,.12);color:var(--tx);box-shadow:none">Cancel</button></div>
</div></div>
<div class="toast glass" id="toast"><span id="tmsg"></span><button class="link" id="undo">Undo</button></div>

<script>
(function(){
var KEY="taskflow.v1",tasks=[],filter="all",editId=null,last=null,tt;
try{tasks=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){tasks=[]}
var $=function(s){return document.querySelector(s)};
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
function esc(s){return s.replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var PC={1:"var(--lo)",2:"var(--mid)",3:"var(--hi)"},PN={1:"Low",2:"Medium",3:"High"};
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(d){var p=d.split("-");return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{day:"numeric",month:"short"})}
function render(first){
  var q=$("#q").value.trim().toLowerCase(),t=today();
  var v=tasks.filter(function(x){return(filter==="all"||(filter==="done")===x.done)&&x.title.toLowerCase().indexOf(q)>-1});
  v.sort(function(a,b){return a.done-b.done||b.pri-a.pri||(a.due||"9").localeCompare(b.due||"9")});
  $("#list").innerHTML=v.length?v.map(function(x,i){
    var late=x.due&&!x.done&&x.due<t;
    return '<li class="task glass'+(x.done?' done':'')+'" data-id="'+x.id+'" style="animation-delay:'+(first?i*60:0)+'ms">'+
    '<button class="tick" data-a="tick" aria-label="Mark complete"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>'+
    '<div class="body"><div class="t">'+esc(x.title)+'</div><div class="meta"><span><i class="dot" style="background:'+PC[x.pri]+';color:'+PC[x.pri]+'"></i>'+PN[x.pri]+'</span>'+(x.due?'<span class="'+(late?'late':'')+'">'+(late?'Overdue · ':'')+fmt(x.due)+'</span>':'')+'</div></div>'+
    '<button class="more" data-a="more" aria-label="Task options">&#8942;</button></li>'}).join(""):
    '<div class="empty"><div class="orb"></div><b>'+(tasks.length?'No matching tasks':'Your list is clear')+'</b><div class="sub">'+(tasks.length?'Try another filter or search.':'Add your first task above.')+'</div></div>';
  var n=tasks.length,d=tasks.filter(function(x){return x.done}).length,p=n?Math.round(d/n*100):0;
  $("#pg").style.strokeDashoffset=163.4*(1-p/100);$("#pct").textContent=p+"%";
  $("#left").textContent=(n-d)+" left of "+n;
  var h=new Date().getHours();$("#sub").textContent=(h<12?"Good morning":h<18?"Good afternoon":"Good evening")+" · "+d+" done today";
}
function toast(m,u){$("#tmsg").textContent=m;$("#undo").style.display=u?"":"none";$("#toast").classList.add("on");clearTimeout(tt);tt=setTimeout(function(){$("#toast").classList.remove("on");last=null},4500)}
function add(){var v=$("#title").value.trim();if(!v){$("#title").focus();return}
  tasks.push({id:Date.now()+""+Math.random().toString(36).slice(2,5),title:v,pri:+$("#pri").value,due:$("#due").value,done:false});
  $("#title").value="";$("#due").value="";save();render();}
$("#addb").onclick=add;$("#title").onkeydown=function(e){if(e.key==="Enter")add()};
$("#q").oninput=function(){render()};
$("#chips").onclick=function(e){var f=e.target.dataset.f;if(!f)return;filter=f;document.querySelectorAll(".chip").forEach(function(c){c.classList.toggle("on",c.dataset.f===f)});render(true)};
function closeMenu(){var m=$(".menu");if(m){m.parentNode.classList.remove("menu-open");m.remove()}}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");
  if(!b){if(!e.target.closest(".menu"))closeMenu();return}
  var li=b.closest(".task"),id=li.dataset.id,t=tasks.filter(function(x){return x.id===id})[0],a=b.dataset.a;
  if(a==="tick"){t.done=!t.done;save();render()}
  else if(a==="more"){var had=li.querySelector(".menu");closeMenu();if(had)return;
    var m=document.createElement("div");m.className="menu";m.innerHTML='<button data-a="edit">Edit</button><button class="del" data-a="del">Delete</button>';li.appendChild(m);li.classList.add("menu-open")}
  else if(a==="edit"){closeMenu();editId=id;$("#et").value=t.title;$("#ep").value=t.pri;$("#ed").value=t.due||"";$("#modal").classList.add("on");$("#et").focus()}
  else if(a==="del"){closeMenu();li.classList.add("out");setTimeout(function(){last={t:t,i:tasks.indexOf(t)};tasks=tasks.filter(function(x){return x.id!==id});save();render();toast("Task deleted",1)},350)}
});
$("#undo").onclick=function(){if(last){tasks.splice(last.i,0,last.t);last=null;save();render();$("#toast").classList.remove("on")}};
function closeModal(){$("#modal").classList.remove("on");editId=null}
$("#cancel").onclick=closeModal;$("#modal").onclick=function(e){if(e.target.id==="modal")closeModal()};
$("#save").onclick=function(){var v=$("#et").value.trim();if(!v)return;var t=tasks.filter(function(x){return x.id===editId})[0];if(t){t.title=v;t.pri=+$("#ep").value;t.due=$("#ed").value;save();render();toast("Changes saved")}closeModal()};
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeModal();closeMenu()}});
$("#clr").onclick=function(){var n=tasks.filter(function(x){return x.done}).length;if(!n){toast("Nothing to clear");return}tasks=tasks.filter(function(x){return!x.done});save();render();toast(n+" completed task"+(n>1?"s":"")+" cleared")};
// PWA: service worker + install
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}
var dp;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;$("#inst").style.display="inline"});
$("#inst").onclick=function(){if(dp){dp.prompt();dp=null;$("#inst").style.display="none"}};
render(true);
})();
</script>
</body>
</html>
